name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run site:build
      - name: Generated files are up to date with tokens/ and icons/svg/
        run: |
          npm run tokens && npm run icons
          git diff --exit-code -- registry/icons 'registry/themes/**/*.tokens.css'
      - name: CLI works from the packed tarball
        run: |
          npm pack
          mkdir -p /tmp/app && cd /tmp/app && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/mitame-*.tgz
          npx mitame init && npx mitame add select dialog
          test -f src/components/mitame/ui/select.tsx
